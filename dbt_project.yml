
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'gfw_illegal_fishing'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'gfw_illegal_fishing'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  vessel_class_confidence_threshold: 0.75
  risk_weight_flag: 5
  risk_weight_hours_anomaly: 2
  risk_weight_tonnage: 2
  risk_weight_engine: 1
  risk_weight_length: 1
  risk_threshold_medium_max: 4 
  
  impact_weight_gear_industrial: 3
  impact_weight_gear_mixed: 1
  impact_weight_tonnage_high: 3
  impact_weight_tonnage_mid: 1
  impact_weight_power_high: 2
  impact_weight_power_mid: 1
  impact_tonnage_p50: 94
  impact_tonnage_p75: 177
  impact_power_p50: 333
  impact_power_p75: 479
  impact_threshold_medium_max: 4
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  gfw_illegal_fishing:
    # Capa 1: Staging -> Guarda en gfw_bronze como Vistas
    1_bronze:
      +schema: bronze
      +materialized: view

    # Capa 2: Intermediate -> Guarda en gfw_silver como Tablas
    2_silver:
      +schema: silver
      +materialized: table

    # Capa 3: Marts -> Guarda en gfw_gold como Tablas
    3_gold:
      +schema: gold
      +materialized: table